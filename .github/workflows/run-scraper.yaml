name: Run Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      TZ: "Asia/Tokyo"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set locale
        run: |
          sudo locale-gen ja_JP.UTF-8

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync

      - name: Generate Config
        run: |
          cat > /tmp/config.yaml << 'EOF'
          check:
              interval_sec: 1800
          slack:
              bot_token: "dummy-token-for-testing"
              from: price-watch
              info:
                  channel:
                      name: "#price"
              error:
                  channel:
                      name: "#error"
                      id: "C0123456789"
                  interval_min: 60
          store: {}
          data:
              selenium: ./data
              dump: ./data/debug
              price: ./data/price
              thumb: ./data/thumb
              metrics: ./data/metrics
              cache: ./data/cache
          webapp:
              static_dir_path: ./static
          target:
              define: target.yaml
          liveness:
              file:
                  crawler: /tmp/healthz
              interval_sec: 300
          edit:
              password_hash: "$argon2id$v=19$m=65536,t=3,p=4$G3sQ/+Jkh/ufAWCJDUTaPw$8wl44G3QrQysWT9mIDLD3bf0fLn0o/RO1EnYVVovyLs"
          EOF

      - name: Run Price Watch (Dry Run)
        run: |
          uv run price-watch \
            -c /tmp/config.yaml \
            -t target.yaml \
            -D \
          2>&1 | tee scraper-output.log || true

      - name: Show Output
        run: |
          echo "=== Scraper Output ==="
          cat scraper-output.log

      - name: Upload Output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-output
          path: scraper-output.log
