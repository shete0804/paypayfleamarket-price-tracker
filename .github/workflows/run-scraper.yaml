name: Run Scraper

on:
  workflow_dispatch:
    inputs:
      group:
        description: "動かすグループ（1 か 2）"
        required: false
        default: "1"
      card:
        description: "テスト：1枚だけ動かすときのカード名（空なら グループ全体）"
        required: false
        default: ""
  push:
    branches:
      - master
    paths-ignore:
      - "results/**"
  schedule:
    # グループ1（5分と35分）と グループ2（20分と50分）。1時間に4回、交互に動く
    - cron: "5,35 * * * *"
    - cron: "20,50 * * * *"

# 1回が約11分かかるので、実行が重ならないように1つずつ順番に動かす（実行中のものは止めない）
concurrency:
  group: run-scraper
  cancel-in-progress: false

jobs:
  scrape:
    timeout-minutes: 45
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TZ: "Asia/Tokyo"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set locale
        run: |
          sudo locale-gen ja_JP.UTF-8

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync

      - name: Generate Config
        run: |
          cat > /tmp/config.yaml << 'EOF'
          check:
              interval_sec: 1
          slack:
              bot_token: "xoxb-dummy-token-for-testing-1234567890"
              from: price-watch
              info:
                  channel:
                      name: "#price"
              error:
                  channel:
                      name: "#error"
                      id: "C0123456789"
                  interval_min: 60
          store:
              amazon:
                  associate: "dummy-22"
                  credential_id: "dummy_id"
                  credential_secret: "dummy_secret"
              yahoo:
                  client_id: "dummy_client_id"
                  secret: "dummy_secret"
          data:
              selenium: ./data
              dump: ./data/debug
              price: ./data/price
              thumb: ./data/thumb
              metrics: ./data/metrics
              cache: ./data/cache
          webapp:
              static_dir_path: ./static
          target:
              define: target.yaml
          liveness:
              file:
                  crawler: /tmp/healthz
              interval_sec: 300
          edit:
              password_hash: "$argon2id$v=19$m=65536,t=3,p=4$G3sQ/+Jkh/ufAWCJDUTaPw$8wl44G3QrQysWT9mIDLD3bf0fLn0o/RO1EnYVVovyLs"
          EOF

      - name: Choose target group
        id: group
        env:
          CARD: ${{ inputs.card }}
        run: |
          if [ -n "$CARD" ]; then
            # テスト：そのカードの項目だけを書いた target_test.yaml を作る
            awk -v n="$CARD" 'BEGIN{h=1; p=0} /^item_list:/{h=0; print; next} h{print; next} /^    - name: /{p=(substr($0,13)==n)} p{print}' target.yaml > target_test.yaml
            echo "target=target_test.yaml" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.group }}" = "2" ] || [ "${{ github.event.schedule }}" = "20,50 * * * *" ]; then
            echo "target=target_g2.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "target=target_g1.yaml" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Price Watch (Dry Run)
        working-directory: ${{ github.workspace }}
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          timeout -s ABRT -k 60 2400 uv run price-watch \
            -c /tmp/config.yaml \
            -t ${{ steps.group.outputs.target }} \
          2>&1 | tee scraper-output.log || true

      - name: Show Output
        run: |
          echo "=== Scraper Output ==="
          cat scraper-output.log

      - name: Extract Top 3 Cheapest Items
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== Top 3 Cheapest: メガルカリオ MUR ==="
          uv run python src/price_watch/cli/extract_top3.py \
            --db-path ./data/price/price.db \
            --keyword "メガルカリオ MUR" \
            --exclude "セット,パック,デッキパーツ" \
            --limit 3 || echo "Failed to extract top 3 items"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          uv run python notify_discord.py || echo "Discord 通知に失敗しました"

      - name: Export results CSV
        if: always()
        run: |
          uv run python export_csv.py ${{ steps.group.outputs.target }} || echo "CSV の書き出しに失敗しました"

      - name: Commit results CSV
        if: always()
        run: |
          [ -f results/paypay.csv ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/paypay.csv
          if git diff --cached --quiet; then
            echo "CSV に変更なし"
          else
            git commit -m "chore: update PayPay results CSV [skip ci]"
            git pull --rebase -q
            git push
          fi

      - name: Upload Output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-output
          path: |
            scraper-output.log
            data/price/price.db


